# AnchorPoint test client — iphone @ Hamburg (hamburg)
# Import into the WireGuard app (iOS / macOS): Add Tunnel -> from file/QR.
# Full tunnel: once connected you browse FROM Hamburg (DE) —
# the site's own WAN is your internet exit. Use it to test Hamburg end-to-end.
[Interface]
PrivateKey = EXAMPLE-PRIVATE-KEY-PLACEHOLDER-NOT-A-REAL-KEY-DO-NOT-USE
Address = 10.0.91.2/32
DNS = 1.1.1.1

[Peer]
PublicKey = EXAMPLE-PUBKEY-hamburg-NOT-A-REAL-KEY
Endpoint = anchorpoint-hamburg.duckdns.org:51821
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25
