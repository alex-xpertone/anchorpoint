# =============================================================================
# AnchorPoint — example inventory (copy this file, then edit)
# =============================================================================
# This is the SMALL config you hand-write. The generator derives ALL addressing,
# ports and interfaces, then renders the RouterOS config for every side:
#   this file --gen-mesh-secrets.py--> secrets/example.sops.yaml (encrypted keys)
#             --render-mesh.py-------> deployments/<node>/bootstrap.sensitive.rsc
#
# Two locations. Each site has a short identifier (its `color` field — a city name
# here, but any short label works: it drives interface/table names, device identity,
# secret keys and the output folder). Keep the two indices as 1 and 2.
#
# Per-site port map (hAP ax2): ether1 = WAN · ether2 = exit via the other site ·
# ether3/4/5 = local network · Wi-Fi: own SSID = local, other site's SSID = exit.
# Plus per site: a wg-clients interface (UDP wg_client_port) for your roaming test
# devices (iPhone + MacBook) — full tunnel, so each device exits at that site.
#
# DNS / endpoint — each site needs a public name/IP its peer dials. Pick ONE mode per node:
#   (A) DuckDNS: set `duckdns_subdomain` (+ one mesh `duckdns_token`). The router self-updates
#       the name every 5 min; the endpoint `ddns` is derived as <subdomain>.duckdns.org.
#       ⚠ Needs RouterOS device-mode (scheduler+fetch) enabled on each box — PHYSICAL access
#       required (see docs/ONBOARDING.md).
#   (B) Your own DDNS / static IP: skip duckdns_subdomain (+ duckdns_token) and set `ddns:`
#       directly. No on-router updater, no device-mode.
#
# WAN failover (optional): give a node a `wan_wifi_backup` (your local router's Wi-Fi)
# and if the ether1 cable drops, the site fails over to that Wi-Fi uplink (2.4 GHz /
# wifi2) and back — the AnchorPoint SSIDs stay on 5 GHz (wifi1). Remove the block for
# wired-only. (Radio names are hAP ax2; ax3 swaps them — see mesh.wifi_*_iface.)
# =============================================================================

mesh:
  name: anchorpoint
  overlay_subnet: 10.0.80.0/24
  wg_port: 51820                 # the WireGuard UDP port (both ends)
  wg_client_port: 51823          # UDP port each site serves its roaming test clients on
  clients: [iphone, macbook]     # per-site roaming devices (each gets its own WireGuard config)
  wifi_ssid_prefix: AnchorPoint  # SSID = AnchorPoint-<ssid_suffix> per site
  wifi_ap_iface: wifi1           # radio for the AnchorPoint SSIDs — 5 GHz on hAP ax2
  wifi_wan_iface: wifi2          # radio for the Wi-Fi WAN backup   — 2.4 GHz on hAP ax2
                                 # (ax3 swaps these; verify with /interface wifi print)
  duckdns_token: REPLACE_duckdns_token  # (DDNS mode A only) DuckDNS account token; gen-mesh-
                                        # secrets.py encrypts it into the bundle & clears it.
                                        # Omit entirely if every node uses mode B (own ddns).
  dns_servers: 1.1.1.1,8.8.8.8   # resolver for the router AND handed to clients (so exit
                                 # clients' DNS follows the tunnel). Any public resolver(s).
  timezone: UTC
  secrets_file: secrets/example.sops.yaml   # generated (encrypted); gitignored

nodes:
  - id: node_hamburg
    color: hamburg                     # per-node identifier (any short name)
    index: 1
    location: Hamburg
    country: DE
    # --- endpoint: pick ONE DDNS mode (see header) ---
    duckdns_subdomain: anchorpoint-hamburg  # (A) DuckDNS — endpoint auto = <sub>.duckdns.org; needs device-mode
    # ddns: hamburg.example.com             # (B) your own DDNS/static instead — then drop duckdns_subdomain
    ssid_suffix: HAM                   # -> SSID "AnchorPoint-HAM"
    wg_public_key: REPLACE_hamburg_public_key   # filled by gen-mesh-secrets.py
    clients:                                    # roaming test devices (pubkeys filled by gen)
      iphone: REPLACE_hamburg_iphone_public_key
      macbook: REPLACE_hamburg_macbook_public_key
    wan_wifi_backup:                            # optional WAN failover — your local router's Wi-Fi
      ssid: HomeWiFi-HAM                        # the 2.4 GHz SSID to join as a backup uplink
      password: REPLACE_hamburg_wan_wifi_password   # its Wi-Fi password; gen encrypts it into the bundle

  - id: node_barcelona
    color: barcelona
    index: 2
    location: Barcelona
    country: ES
    # --- endpoint: pick ONE DDNS mode (see header) ---
    duckdns_subdomain: anchorpoint-barcelona  # (A) DuckDNS
    # ddns: barcelona.example.com             # (B) your own DDNS/static instead
    ssid_suffix: BCN                   # -> SSID "AnchorPoint-BCN"
    wg_public_key: REPLACE_barcelona_public_key
    clients:
      iphone: REPLACE_barcelona_iphone_public_key
      macbook: REPLACE_barcelona_macbook_public_key
    wan_wifi_backup:
      ssid: HomeWiFi-BCN
      password: REPLACE_barcelona_wan_wifi_password

# Both sites must be reachable at their `ddns` endpoint (public IP or DDNS), and each
# site's ISP router must forward UDP wg_port to it. See docs/ONBOARDING.md.
